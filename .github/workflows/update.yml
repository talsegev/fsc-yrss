name: Update Yonder RSS DEBUG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        shell: bash
        run: |
          echo "=== INSTALL DEPENDENCIES ==="

          python --version
          PYTHON_STATUS=$?

          if [ "$PYTHON_STATUS" -ne 0 ]; then
            echo "CUSTOM ERROR: PYTHON_COMMAND_FAILED"
            exit 30
          fi

          python -m pip install requests
          PIP_STATUS=$?

          if [ "$PIP_STATUS" -ne 0 ]; then
            echo "CUSTOM ERROR: PIP_INSTALL_FAILED"
            exit 31
          fi

          echo "INSTALL OK"

      - name: Check SoundCloud secret
        shell: bash
        env:
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          echo "=== CHECK SOUNDCLOUD CLIENT ID ==="

          if [ -z "$SOUNDCLOUD_CLIENT_ID" ]; then
            echo "CUSTOM ERROR: SOUNDCLOUD_CLIENT_ID_MISSING"
            exit 10
          fi

          echo "SoundCloud client ID is present"
          echo "Length: ${#SOUNDCLOUD_CLIENT_ID}"

      - name: Check repository files
        shell: bash
        run: |
          echo "=== CHECK FILES ==="

          echo "PWD:"
          pwd

          echo ""
          echo "FILES:"
          ls -la

          echo ""
          echo "Checking generate_feed.py..."

          if [ ! -f generate_feed.py ]; then
            echo "CUSTOM ERROR: GENERATE_FEED_PY_MISSING"
            exit 20
          fi

          echo "generate_feed.py exists"

      - name: Run Python generator
        shell: bash
        env:
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          echo "=== RUN GENERATE_FEED.PY ==="

          set +e

          python -u generate_feed.py

          PYTHON_EXIT=$?

          set -e

          echo ""
          echo "Python returned: $PYTHON_EXIT"

          if [ "$PYTHON_EXIT" -ne 0 ]; then
            echo "CUSTOM ERROR: GENERATE_FEED_FAILED"
            echo "CUSTOM ERROR CODE: 40"
            exit 40
          fi

          echo "GENERATOR OK"

      - name: Check XML
        shell: bash
        run: |
          echo "=== CHECK XML ==="

          if [ ! -f yonder.xml ]; then
            echo "CUSTOM ERROR: YONDER_XML_MISSING"
            echo "CUSTOM ERROR CODE: 50"
            exit 50
          fi

          if [ ! -s yonder.xml ]; then
            echo "CUSTOM ERROR: YONDER_XML_EMPTY"
            echo "CUSTOM ERROR CODE: 51"
            exit 51
          fi

          echo "XML exists:"
          ls -lh yonder.xml

      - name: Test Git
        shell: bash
        run: |
          echo "=== TEST GIT ==="

          git status

          GIT_STATUS=$?

          if [ "$GIT_STATUS" -ne 0 ]; then
            echo "CUSTOM ERROR: GIT_STATUS_FAILED"
            exit 60
          fi

          echo "Git OK"

      - name: Commit and push
        shell: bash
        run: |
          echo "=== COMMIT AND PUSH ==="

          git config user.name "Yonder RSS Bot"
          CONFIG_NAME=$?

          if [ "$CONFIG_NAME" -ne 0 ]; then
            echo "CUSTOM ERROR: GIT_CONFIG_NAME_FAILED"
            exit 61
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CONFIG_EMAIL=$?

          if [ "$CONFIG_EMAIL" -ne 0 ]; then
            echo "CUSTOM ERROR: GIT_CONFIG_EMAIL_FAILED"
            exit 62
          fi

          git add yonder.xml
          ADD_STATUS=$?

          if [ "$ADD_STATUS" -ne 0 ]; then
            echo "CUSTOM ERROR: GIT_ADD_FAILED"
            exit 70
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Yonder RSS feed"
          COMMIT_STATUS=$?

          if [ "$COMMIT_STATUS" -ne 0 ]; then
            echo "CUSTOM ERROR: GIT_COMMIT_FAILED"
            exit 71
          fi

          git push
          PUSH_STATUS=$?

          if [ "$PUSH_STATUS" -ne 0 ]; then
            echo "CUSTOM ERROR: GIT_PUSH_FAILED"
            exit 80
          fi

          echo "=== SUCCESS ==="
