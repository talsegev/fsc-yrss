name: Update Yonder RSS Debug

on:
workflow_dispatch:
schedule:
- cron: "*/30 * * * *"

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.x"

  - name: Install dependencies
    run: pip install requests

  - name: Generate RSS
    env:
      SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
    run: python generate_feed.py

  - name: Verify RSS
    run: |
      test -s yonder.xml
      python -c "import xml.etree.ElementTree as ET; ET.parse('yonder.xml')"

  - name: Commit updated feed
    run: |
      git config user.name "Yonder RSS Bot"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add yonder.xml
      git diff --cached --quiet || git commit -m "Update Yonder RSS feed"
      git push
