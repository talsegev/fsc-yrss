name: Update Yonder RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python --version || exit 30
          pip --version || exit 30
          pip install requests || exit 30

      - name: Check SoundCloud secret
        env:
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          if [ -z "$SOUNDCLOUD_CLIENT_ID" ]; then
            echo "ERROR CODE 10: SOUNDCLOUD_CLIENT_ID is missing"
            exit 10
          fi

          echo "OK: SOUNDCLOUD_CLIENT_ID is configured"
          echo "Client ID length: ${#SOUNDCLOUD_CLIENT_ID}"

      - name: Check Python file
        run: |
          if [ ! -f generate_feed.py ]; then
            echo "ERROR CODE 20: generate_feed.py not found"
            exit 20
          fi

          echo "OK: generate_feed.py exists"
          ls -lh generate_feed.py

      - name: Generate RSS
        env:
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          echo "Starting generate_feed.py..."

          python -u generate_feed.py

          RESULT=$?

          if [ $RESULT -ne 0 ]; then
            echo "ERROR CODE 40: generate_feed.py failed"
            echo "Python exit code: $RESULT"
            exit 40
          fi

          echo "OK: generate_feed.py completed"

      - name: Check generated XML
        run: |
          if [ ! -f yonder.xml ]; then
            echo "ERROR CODE 50: yonder.xml was not created"
            exit 50
          fi

          if [ ! -s yonder.xml ]; then
            echo "ERROR CODE 51: yonder.xml exists but is empty"
            exit 51
          fi

          echo "OK: yonder.xml exists"
          ls -lh yonder.xml

      - name: Configure Git
        run: |
          git config user.name "Yonder RSS Bot" || {
            echo "ERROR CODE 60: Failed to configure Git user.name"
            exit 60
          }

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || {
            echo "ERROR CODE 61: Failed to configure Git user.email"
            exit 61
          }

          echo "OK: Git configured"

      - name: Commit updated feed
        run: |
          git add yonder.xml || {
            echo "ERROR CODE 70: git add failed"
            exit 70
          }

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Yonder RSS feed" || {
            echo "ERROR CODE 71: git commit failed"
            exit 71
          }

          echo "OK: Commit created"

      - name: Push updated feed
        run: |
          git push || {
            echo "ERROR CODE 80: git push failed"
            exit 80
          }

          echo "OK: Feed pushed successfully"
