name: Update Yonder RSS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 01 - Checkout repository
        uses: actions/checkout@v5

      - name: 02 - Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 03 - Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: 04 - Check SoundCloud secret
        env:
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          if [ -z "$SOUNDCLOUD_CLIENT_ID" ]; then
            echo "ERROR 30: SOUNDCLOUD_CLIENT_ID is missing"
            exit 30
          fi

          echo "SOUNDCLOUD_CLIENT_ID is configured"

      - name: 05 - Verify files
        run: |
          if [ ! -f generate_feed.py ]; then
            echo "ERROR 10: generate_feed.py not found"
            exit 10
          fi

          echo "generate_feed.py found"

      - name: 06 - Test SoundCloud API
        env:
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          client_id = os.environ.get("SOUNDCLOUD_CLIENT_ID")

          url = "https://api-v2.soundcloud.com/users/19053868/tracks"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140 Safari/537.36"
              ),
              "Accept": "application/json",
              "Referer": "https://soundcloud.com/yondertapes",
          }

          params = {
              "client_id": client_id,
              "limit": 1,
          }

          print("Testing SoundCloud API...")

          try:
              response = requests.get(
                  url,
                  headers=headers,
                  params=params,
                  timeout=30,
              )
          except Exception as exc:
              print("ERROR 51: SoundCloud request failed")
              print(exc)
              sys.exit(51)

          print("HTTP status:", response.status_code)

          if response.status_code != 200:
              print("ERROR 52: SoundCloud API returned an error")
              print(response.text[:1000])
              sys.exit(52)

          try:
              data = response.json()
          except Exception as exc:
              print("ERROR 53: Invalid JSON response")
              print(exc)
              sys.exit(53)

          print("SoundCloud API OK")
          print("Tracks returned:", len(data.get("collection", [])))
          PY

      - name: 07 - Generate RSS
        env:
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          python -u -X faulthandler generate_feed.py

      - name: 08 - Verify RSS
        run: |
          if [ ! -f yonder.xml ]; then
            echo "ERROR 70: yonder.xml was not created"
            exit 70
          fi

          if [ ! -s yonder.xml ]; then
            echo "ERROR 71: yonder.xml is empty"
            exit 71
          fi

          echo "RSS generated successfully"
          echo "Size: $(wc -c < yonder.xml) bytes"

      - name: 09 - Git status
        run: |
          git status --short

      - name: 10 - Commit and push
        run: |
          git config user.name "Yonder RSS Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add yonder.xml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Yonder RSS feed"
          git push
